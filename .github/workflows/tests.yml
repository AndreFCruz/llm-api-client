name: Tests

on:
  push:
    paths:
      - "llm_api_client/**"
      - "tests/**"
      - "requirements/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "llm_api_client/**"
      - "tests/**"
      - "requirements/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
    - name: Test with tox
      run: tox
    - name: Test with the oldest supported pyrate-limiter
      if: matrix.python-version == '3.11'
      run: |
        python -m pip install ".[tests]" "pyrate-limiter==$(grep -oP '^pyrate-limiter>=\K[0-9.]+' requirements/main.txt)"
        python -m pytest
